# All requests for placefinder.test go to the Service of PlaceFinder
# (deploy/k8s/placefinder.yaml of PlaceFinder, port 80).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: placefinder
spec:
  parentRefs:
    - name: web
  hostnames:
    - placefinder.test
  rules:
    - backendRefs:
        - name: placefinder
          port: 80
