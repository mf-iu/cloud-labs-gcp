#cloud-config
# Installs PlaceFinder from Git and runs it as a systemd service on port 8000.
# create-vm.sh replaces __REPO__ (Git URL) and __REF__ (tag or branch).
# Progress on the VM: cloud-init status --wait; journalctl --unit placefinder

package_update: true
packages:
  - git
  - curl
  - unzip

write_files:
  - path: /etc/systemd/system/placefinder.service
    permissions: "0644"
    content: |
      [Unit]
      Description=PlaceFinder API
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=placefinder
      WorkingDirectory=/opt/placefinder/app
      Environment=DATA_FILE=/opt/placefinder/data/cities15000.txt
      ExecStart=/opt/placefinder/app/.venv/bin/uvicorn placefinder.main:app --host 0.0.0.0 --port 8000
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Service account without login shell
  - useradd --system --create-home --home-dir /opt/placefinder --shell /usr/sbin/nologin placefinder
  # uv installs Python and the dependencies for this user only
  - sudo --user placefinder --set-home sh -c 'curl --location --silent --show-error --fail https://astral.sh/uv/install.sh | sh'
  - sudo --user placefinder --set-home git clone --depth 1 --branch '__REF__' '__REPO__' /opt/placefinder/app
  - sudo --user placefinder --set-home sh -c 'cd /opt/placefinder/app && /opt/placefinder/.local/bin/uv sync --frozen --no-dev'
  # GeoNames cities15000 (CC BY 4.0)
  - sudo --user placefinder --set-home mkdir --parents /opt/placefinder/data
  - sudo --user placefinder --set-home sh -c 'cd /opt/placefinder/data && curl --fail --silent --show-error --location --remote-name https://download.geonames.org/export/dump/cities15000.zip && unzip -o cities15000.zip'
  - systemctl daemon-reload
  - systemctl enable --now placefinder.service
